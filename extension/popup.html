<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; padding: 14px; font-family: sans-serif; font-size: 14px; }
    p { margin: 0 0 10px; color: #333; }
    label { display: block; margin-bottom: 4px; color: #666; font-weight: 500; }
    select { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <p>유튜브 재생 페이지에서 <strong>MP3 저장</strong> 버튼으로 다운로드합니다.</p>
  <label for="server">서버 주소</label>
  <input id="server" type="text" placeholder="http://127.0.0.1:38472" style="width:100%;box-sizing:border-box;padding:6px 8px;margin-bottom:10px;border:1px solid #ccc;border-radius:4px;font-size:13px;">
  <label for="quality">음질</label>
  <select id="quality">
    <option value="0">고음질 (320k)</option>
    <option value="5">보통</option>
    <option value="9">저용량</option>
  </select>
  <script src="popup.js"></script>
</body>
</html>
